name: Module 12 Content Calendar Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digimarket_ci
          POSTGRES_PASSWORD: ephemeral-content-only
          POSTGRES_DB: digimarket_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U digimarket_ci -d digimarket_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://digimarket_ci:ephemeral-content-only@127.0.0.1:5432/digimarket_ci
      DIRECT_DATABASE_URL: postgresql://digimarket_ci:ephemeral-content-only@127.0.0.1:5432/digimarket_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations and check schema drift
        run: |
          test -s packages/db/prisma/migrations/20261020010000_content_calendar/migration.sql
          pnpm --filter @digimarket/db db:validate
          pnpm --filter @digimarket/db db:generate
          pnpm --filter @digimarket/db db:migrate:deploy
          pnpm --filter @digimarket/db db:migrate:deploy
          pnpm --filter @digimarket/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Lint, typecheck, tests and builds
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Content calendar workflow and authorization
        run: pnpm --filter @digimarket/api exec tsx src/content/integration-smoke.ts
      - name: Existing project and approval workflow regressions
        run: |
          pnpm --filter @digimarket/api exec tsx src/projects/integration-smoke.ts
          pnpm --filter @digimarket/api exec tsx src/approvals/integration-smoke.ts
