name: Module 6 Finance Integration
on:
  push:
    branches: [main, feature/module-06-finance]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digimarket_ci
          POSTGRES_PASSWORD: ephemeral-finance-only
          POSTGRES_DB: digimarket_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U digimarket_ci -d digimarket_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      API_INTERNAL_URL: http://127.0.0.1:4000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      BOOTSTRAP_ORG_NAME: "DigiMarket Finance Browser CI"
      BOOTSTRAP_ADMIN_LOGIN: admin-e2e
      DATABASE_URL: postgresql://digimarket_ci:ephemeral-finance-only@127.0.0.1:5432/digimarket_ci
      DIRECT_DATABASE_URL: postgresql://digimarket_ci:ephemeral-finance-only@127.0.0.1:5432/digimarket_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify migration and generated client
        run: |
          test -s packages/db/prisma/migrations/20261019030000_finance_ledger/migration.sql
          pnpm --filter @digimarket/db db:validate
          pnpm --filter @digimarket/db db:generate
          pnpm --filter @digimarket/db db:migrate:deploy
          pnpm --filter @digimarket/db db:migrate:deploy
          pnpm --filter @digimarket/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Check quality and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Create ephemeral auth secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_CHALLENGE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          INITIAL=$(openssl rand -hex 24)
          UPDATED=$(openssl rand -hex 24)
          echo "::add-mask::$INITIAL"
          echo "::add-mask::$UPDATED"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$INITIAL" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_INITIAL_PASSWORD=$INITIAL" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_UPDATED_PASSWORD=$UPDATED" >> "$GITHUB_ENV"
      - name: Bootstrap isolated administrator
        run: pnpm --filter @digimarket/api exec tsx src/auth/bootstrap.ts
      - name: Install Playwright Chromium
        run: pnpm --filter @digimarket/web exec playwright install chromium --with-deps
      - name: Test real finance and approvals browser journeys
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=test pnpm --filter @digimarket/api start > /tmp/module6-api.log 2>&1 &
          API_PID=$!
          pnpm --filter @digimarket/web start > /tmp/module6-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true; tail -n 90 /tmp/module6-api.log; tail -n 90 /tmp/module6-web.log' EXIT
          pnpm --filter @digimarket/web test:e2e
      - name: Test approval state machine against PostgreSQL
        run: pnpm --filter @digimarket/api exec tsx src/approvals/integration-smoke.ts
      - name: Test finance state machine and reconciliation against PostgreSQL
        run: pnpm --filter @digimarket/api exec tsx src/finance/integration-smoke.ts
