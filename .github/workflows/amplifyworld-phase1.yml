name: AmplifyWorld Phase 1 Design Preview

on:
  push:
    branches:
      - feat/amplifyworld-ui-phase-1
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/amplifyworld-phase1.yml'

permissions:
  contents: read

jobs:
  design-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace contracts
        run: pnpm --filter @digimarket/contracts build
      - name: Lint and typecheck web
        run: |
          pnpm lint
          pnpm --filter @digimarket/web typecheck
      - name: Build Next.js preview
        run: pnpm --filter @digimarket/web build
      - name: Install Chromium
        run: pnpm --filter @digimarket/web exec playwright install chromium --with-deps
      - name: Browser regression - responsive preview
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @digimarket/web start > /tmp/aw-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true; tail -n 120 /tmp/aw-web.log' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/design-preview; then break; fi
            sleep 2
          done
          pnpm --filter @digimarket/web exec playwright test tests/design-preview.spec.ts
