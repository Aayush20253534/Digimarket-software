# DigiMarket FREE-TIER Render Blueprint.
# Creates only the free API web service: NO paid background worker.
# Migrations + permission seeding run in startCommand because Render Free
# does not provide a pre-deploy command. Initial admin bootstrap remains
# guarded by the temporary BOOTSTRAP_* secrets documented in docs/29.
# The API does not need Redis. BullMQ background jobs will not run.
services:
  - type: web
    name: digimarket-api
    runtime: node
    plan: free
    repo: https://github.com/Aayush20253534/Digimarket-software
    branch: main
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /api/v1/ready
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @digimarket/db db:generate && pnpm --filter @digimarket/contracts build && pnpm --filter @digimarket/api build
    startCommand: pnpm --filter @digimarket/db db:migrate:deploy && pnpm --filter @digimarket/api exec tsx ../../packages/db/src/seed.ts && pnpm --filter @digimarket/api start
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_CHALLENGE_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY_BASE64
        sync: false
      - key: JWT_ISSUER
        value: digimarket-api
      - key: JWT_AUDIENCE
        value: digimarket-web
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OPS_MONITOR_TOKEN
        sync: false
