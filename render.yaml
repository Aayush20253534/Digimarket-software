# Blueprint template only: auto-deploy is OFF until protected release gates and
# production secrets, DB backups, and managed Redis are configured.
# Connect as a Blueprint in Render; this file does not create services by itself.
services:
  - type: web
    name: digimarket-api
    runtime: node
    repo: https://github.com/Aayush20253534/Digimarket-software
    branch: main
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /api/v1/ready
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @digimarket/db db:generate && pnpm --filter @digimarket/contracts build && pnpm --filter @digimarket/api build
    preDeployCommand: pnpm --filter @digimarket/db db:migrate:deploy && pnpm --filter @digimarket/api exec tsx ../../packages/db/src/seed.ts
    startCommand: pnpm --filter @digimarket/api start
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_CHALLENGE_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY_BASE64
        sync: false
      - key: JWT_ISSUER
        value: digimarket-api
      - key: JWT_AUDIENCE
        value: digimarket-web
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OPS_MONITOR_TOKEN
        sync: false
  - type: worker
    name: digimarket-worker
    runtime: node
    repo: https://github.com/Aayush20253534/Digimarket-software
    branch: main
    region: singapore
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @digimarket/db db:generate && pnpm --filter @digimarket/worker build
    startCommand: pnpm --filter @digimarket/worker start
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
